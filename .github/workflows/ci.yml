name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check src tests scripts
      - run: mypy
      # Exports are validated for real here: pySigma parses every Sigma rule, yara-x compiles every YARA rule.
      - run: pytest -q
      - run: iisguard --help
      - name: Rule-pack index is in sync with the bundled rules
        run: python scripts/build_rule_pack_index.py && git diff --exit-code rule-packs
      - name: Build the single-file bundle and smoke-test it
        run: |
          python scripts/build_bundle.py
          python dist/iisguard.pyz --version
          python dist/iisguard.pyz audit --kev --offline --inventory tests/fixtures/inventory.json
