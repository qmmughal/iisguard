name: Release
# Push a tag like v0.4.0 to publish. One-time setup on PyPI: add a "trusted publisher" for this repository and the
# workflow file release.yml (environment: pypi). No API token is stored anywhere.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip build
      - run: python -m pip install -e ".[dev]" && pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  windows-bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_bundle.py
      - run: python dist/iisguard.pyz --version
      - name: SHA-256
        shell: pwsh
        run: Get-FileHash dist/iisguard-windows-bundle.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  iisguard-windows-bundle.zip" } | Tee-Object dist/iisguard-windows-bundle.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: |
            dist/iisguard-windows-bundle.zip
            dist/iisguard-windows-bundle.zip.sha256

  publish-pypi:
    needs: [build, windows-bundle]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, windows-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
          generate_release_notes: true
