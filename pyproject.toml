[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iisguard"
version = "0.4.0"
description = "Free website-defense toolkit: audit, detect, block, fix and share detections for IIS, nginx, Apache and PHP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Qaiser" }]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
win = ["pywin32>=306; sys_platform == 'win32'"]
report = ["jinja2>=3"]
dev = ["pytest>=8", "ruff", "mypy", "pyyaml>=6", "types-PyYAML", "pysigma>=1", "yara-x>=1", "build"]

[project.scripts]
iisguard = "iisguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iisguard = ["rules/*.yaml", "rules/VERSION", "data/*.json", "audit/data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # long lines in rule tables are intentional; ruff format handles layout


[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/iisguard"]
